name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Vendors the OCR engine, so this also catches a broken vendor step.
      - name: Build
        run: npm run build

      - name: Check the service worker and manifest were emitted
        run: |
          test -f dist/sw.js || { echo "no service worker in dist/"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "no web manifest in dist/"; exit 1; }
          test -f dist/tesseract/worker.min.js || echo "note: OCR engine not vendored (falls back to CDN)"
