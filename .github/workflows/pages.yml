# Publish the app to GitHub Pages.
#
# A project site serves under /<repo>/ rather than the domain root, which is
# why the build takes BASE_PATH — see `base` in vite.config.ts. Every other
# host in docs/DEPLOYING.md serves at the root and needs none of this.
#
# GitHub Pages cannot set response headers, so the Content-Security-Policy in
# public/_headers does not apply here. The app works without it; a real
# deployment should prefer a host that can send it.
name: Pages

on:
  push:
    branches: [claude/web-app-notifications-camera-ipb7lc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Only to see whether GitHub's own branch publisher is still running.
  actions: read

# Let a run finish rather than cancelling it: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # 'workflow' when this workflow is the only publisher; anything else
      # means GitHub is publishing the repository root as well.
      pages_source: ${{ steps.publisher.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `prebuild` vendors Inter and the OCR engine into public/, which is
      # gitignored — so this needs network access, and the build is not
      # reproducible without it.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub has two Pages publishers and only one of them is this workflow.
      # With the repository's Pages source set to "Deploy from a branch",
      # GitHub also runs its own Jekyll build over the repository *root* and
      # deploys that — the source `index.html`, whose script tag is
      # `/src/main.tsx`, which no browser can run. Both fire on every push and
      # the later one wins, by a few seconds, either way: for d7180b9 the
      # branch publisher landed last (06:41:31 against 06:41:24) and the app on
      # a real phone was replaced by its own "could not start" screen; for
      # 5054860 this workflow landed last (10:44:56 against 10:44:52) and the
      # same commit was fine. Every run was green both times.
      #
      # The fix is the repository's own setting, so ask what it is — that is
      # not a race — and try to put it right. The workflow token is usually not
      # allowed to (403 "Resource not accessible by integration", measured), in
      # which case this *warns and carries on*. It must never fail: `deploy`
      # needs this job, so failing here would stop the only publisher that
      # produces a working site and hand the domain to the broken one.
      - id: publisher
        name: Check which publishers Pages is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          current=$(curl -fsS "${auth[@]}" "$api" | jq -r '.build_type // "unknown"') || current=unknown
          echo "Pages build_type is '$current'"

          if [ "$current" != "workflow" ]; then
            echo "Trying to make this workflow the only publisher."
            code=$(curl -sS -o /tmp/pages-put.txt -w '%{http_code}' -X PUT "${auth[@]}" \
              -H 'Content-Type: application/json' \
              "$api" -d '{"build_type":"workflow"}')

            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              echo "Switched it — from now on only this workflow publishes the site."
              current=workflow
            else
              cat /tmp/pages-put.txt || true
              echo "::warning title=Pages is publishing the repository source too::\
          GitHub is also deploying the repository root with Jekyll, which has no built app in it. \
          Whichever publisher lands last wins, so the site breaks at random. \
          This workflow could not change it (HTTP $code) — fix it once by hand: \
          Settings -> Pages -> Build and deployment -> Source: GitHub Actions."
            fi
          fi

          echo "source=$current" >> "$GITHUB_OUTPUT"

      # Asks GitHub to turn Pages on if it is not on already. The workflow
      # token is often not allowed to create a Pages site — the step then fails
      # with "Resource not accessible by integration", and Pages has to be
      # switched on once by hand: Settings -> Pages -> Source: GitHub Actions.
      # After that this step finds the site and the run goes through.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # While the repository is still publishing its root as well, the winner
      # is whoever deploys last — so wait for the other one and be last on
      # purpose. This is a mitigation and not the fix: the fix is the setting,
      # which the step above warns about. Skipped entirely once it is right.
      - name: Let the branch publisher go first
        if: needs.build.outputs.pages_source != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          runs="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50"

          for attempt in $(seq 1 30); do
            state=$(curl -fsS "${auth[@]}" "$runs" | jq -r '
              [.workflow_runs[] | select(.name == "pages build and deployment")]
              | if length == 0 then "absent" else .[0].status end') || state=unknown

            case "$state" in
              completed)
                echo "the branch publisher has finished; deploying after it"
                sleep 5
                exit 0
                ;;
              absent)
                # It is created within a second of the push, so by the time the
                # build has run it exists. Give it a couple of tries anyway.
                if [ "$attempt" -ge 3 ]; then
                  echo "no branch publisher for this commit"
                  exit 0
                fi
                ;;
            esac

            echo "attempt $attempt: branch publisher is '$state'"
            sleep 10
          done

          echo "::warning::the branch publisher did not finish in time; deploying anyway"

      - id: deploy
        uses: actions/deploy-pages@v4

      # And then the belt to that pair of braces: whatever the configuration
      # says, read back what is actually being served. This cannot catch the
      # race on its own, but it does catch a build that deployed something
      # unusable for any other reason.
      - name: Check the deployed site is this build
        run: |
          url='${{ steps.deploy.outputs.page_url }}'
          echo "reading back $url"
          sleep 45

          for attempt in 1 2 3 4; do
            html=$(curl -fsSL --max-time 30 "$url" || true)

            case "$html" in
              *'/src/main.tsx'*)
                echo "::error::$url is serving the repository source, not this build."
                exit 1
                ;;
              *'/assets/index-'*)
                echo "$url is serving this build."
                exit 0
                ;;
            esac

            echo "attempt $attempt: no verdict yet, waiting"
            sleep 20
          done

          echo "::error::could not read $url back after deploying it."
          exit 1
