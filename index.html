<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the iPhone notch and
         home indicator; the safe-area insets in the CSS keep content clear. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Keep your bowling scores, scan paper sheets, and never lose a game." />

    <!-- iOS ignores the manifest for these, so they have to be declared here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lane Log" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted, so this is same-origin and precached; the preload just
         starts it before the stylesheet asks. -->
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- The manifest link is injected by vite-plugin-pwa, which writes it
         relative to the app's base. Declaring it here as well would win, and
         under a subpath it would point at somebody else's manifest. -->

    <title>Lane Log</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      The last resort, and deliberately the only script on the page that is not
      a module: nothing here may depend on the bundle, because the case it
      exists for is the bundle not arriving.

      A white page is the worst thing a web app can do, because it is the one
      failure that says nothing at all — and on somebody else's phone, with no
      console, it cannot even be reported. Two things stop that here.

      **A missing asset heals itself, once.** This site is served from GitHub
      Pages, where a deploy deletes the old hashed files. A phone that had
      already installed the service worker keeps being served the precached
      `index.html`, which names files the server no longer has — and because
      updates are behind a prompt that the app itself has to draw, the app that
      would draw it never loads. That is a permanent white page with no way out
      from inside. Catching the failed asset load, clearing the caches and
      reloading breaks it. Guarded by a session flag so it cannot loop, and it
      touches nothing but the HTTP caches: the games are in IndexedDB.

      **Anything else says so.** An error before the app mounts paints its own
      message, in both languages, with a button that does the same clearing by
      hand. Somebody can read it out or photograph it.
    -->
    <script>
      (function () {
        var HEALED = 'lane-log.healed';
        var ready = false;

        // Before anything else: a ground to fail against. A stylesheet that
        // never arrives would otherwise leave a white page even when the only
        // problem is the stylesheet.
        document.documentElement.style.background = '#161826';

        function clearCaches(done) {
          var finished = false;
          function finish() {
            if (finished) return;
            finished = true;
            done();
          }

          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  }),
                );
              }),
            );
          }
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key);
                  }),
                );
              }),
            );
          }

          if (!jobs.length) return finish();
          Promise.all(jobs).then(finish, finish);
          // Never hang on it: a reload that did not happen is a white page.
          setTimeout(finish, 4000);
        }

        // A published site that was never built names its *source* entry — a
        // path under /src/ ending in .tsx, which no browser can run. Nothing
        // on this phone caused that and nothing on it can fix it.
        function isUnbuilt(src) {
          return /\/src\/[^?#]*\.[jt]sx?($|[?#])/.test(String(src || ''));
        }

        function show(detail, unbuilt) {
          var root = document.getElementById('root');
          if (!root) return;

          // Two different failures, and telling somebody to clear their cache
          // for the second one is worse than saying nothing: they will do it,
          // it will not help, and on a phone that had a working offline copy
          // it throws that copy away while the server is serving the wrong
          // files. So this case gets its own words and its own button.
          var advice = unbuilt
            ? '<p style="margin:0 0 6px;color:#b2b6ca">The published site is missing its built files, ' +
              'so there is nothing here to fix. Clearing the cache will not help. It usually comes ' +
              'back on its own once the site is published again.</p>' +
              '<p style="margin:0 0 16px;color:#b2b6ca">公開されているサイトにビルド済みのファイルがありません。' +
              'キャッシュを消しても直りません。サイトが公開し直されれば元に戻ります。</p>'
            : '<p style="margin:0 0 6px;color:#b2b6ca">Clearing this app&rsquo;s cache usually fixes it. ' +
              'Your saved games are not touched.</p>' +
              '<p style="margin:0 0 16px;color:#b2b6ca">キャッシュを消すとたいてい直ります。保存したゲームは削除されません。</p>';

          root.innerHTML =
            '<div style="min-height:100%;display:flex;align-items:center;justify-content:center;' +
            'padding:28px;font:14px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;' +
            'color:#e9e9ed;background:#161826">' +
            '<div style="max-width:22rem">' +
            '<div style="font-size:17px;font-weight:600;margin-bottom:10px">Lane Log could not start</div>' +
            advice +
            '<button id="lane-log-heal" style="width:100%;min-height:52px;border-radius:12px;' +
            'border:1px solid #5d5294;background:#2b2741;color:#e7e5fe;font:inherit;font-weight:500">' +
            (unbuilt ? 'Try again · もう一度' : 'Clear and reload · 消して再読み込み') +
            '</button>' +
            '<pre style="margin:16px 0 0;white-space:pre-wrap;word-break:break-word;font-size:11px;' +
            'color:#75798c">' +
            String(detail || '').replace(/[<&]/g, '') +
            '</pre>' +
            '</div></div>';

          var button = document.getElementById('lane-log-heal');
          if (button) {
            button.onclick = function () {
              button.disabled = true;
              if (unbuilt) return location.reload();
              button.textContent = 'Clearing…';
              clearCaches(function () {
                location.reload();
              });
            };
          }
        }

        function heal(detail) {
          var already = false;
          try {
            already = sessionStorage.getItem(HEALED) === '1';
          } catch (e) {
            // Private browsing. One attempt, then the message.
          }

          if (already) return show(detail);

          try {
            sessionStorage.setItem(HEALED, '1');
          } catch (e) {
            /* as above */
          }
          clearCaches(function () {
            location.reload();
          });
        }

        // Capture phase, because a failed <script> or <link> does not bubble.
        // This is the stale-precache case, and the only one worth healing
        // automatically: the file the page was told to load is not there.
        window.addEventListener(
          'error',
          function (event) {
            if (ready) return;
            var tag = event.target && event.target.tagName;
            if (tag !== 'SCRIPT' && tag !== 'LINK') return;

            var href = event.target.src || event.target.href || '';
            var detail = 'Could not load ' + (href || tag);

            // A source entry means the *server* is handing out an unbuilt
            // page. Healing would clear the caches, reload into exactly the
            // same page, and have spent the offline copy for nothing.
            if (isUnbuilt(href)) return show(detail, true);

            heal(detail);
          },
          true,
        );

        // Anything else that goes wrong before the app draws. Not healed
        // automatically — a bug in the app is not fixed by clearing a cache,
        // and reloading into it twice would only hide the message.
        window.addEventListener('error', function (event) {
          if (!ready && event.message) show(event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (!ready) show(event.reason && (event.reason.message || event.reason));
        });

        // And the silent case: nothing threw, nothing 404'd, and still nothing
        // drew. Long enough that a slow connection finishes first.
        setTimeout(function () {
          if (!window.__laneLogReady) {
            show('The app did not start within 20 seconds.');
          }
        }, 20000);

        Object.defineProperty(window, '__laneLogReady', {
          set: function () {
            ready = true;
            try {
              sessionStorage.removeItem(HEALED);
            } catch (e) {
              /* nothing to clear */
            }
          },
          get: function () {
            return ready;
          },
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
